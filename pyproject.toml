[project]
name = "qclassify"
version = "0.1.0"
description = "A tiny name-versus-search neural classifier with ONNX export"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "threadpoolctl>=3.5,<4",
  "torch>=2.6,<3",
]

[project.scripts]
qclassify-train = "qclassify.train:main"
qclassify-predict = "qclassify.predict:main"
qclassify-export-web = "qclassify.export_web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
